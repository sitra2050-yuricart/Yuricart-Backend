name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    # Job name is the required status check context ("Build") in branch protection.
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Syntax check all source files
        run: |
          set -euo pipefail
          find api src scripts -name '*.js' -print0 | xargs -0 -n1 node --check
